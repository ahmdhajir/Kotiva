<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Kotiva</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kotiva"><meta name="theme-color" content="#f3efe6">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{color-scheme:light;--p:#f3efe6;--i:#111;--x:#ff4a1c;--m:#6b665c;--ok:#1a7f4b;--bad:#d62d20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--p);color:var(--i);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#v{padding:18px 16px 96px;max-width:560px;margin:auto}
h1{font:900 30px/1.15 'Fraunces','IBM Plex Sans Arabic',serif;margin:8px 0 4px;letter-spacing:-.5px}
h1 span{display:none}
h3{margin:26px 0 8px;font-size:13px;letter-spacing:1px;border-bottom:2px solid var(--i);padding-bottom:6px;font-weight:700}
.mu{color:var(--m);font-size:12px}
.cd{border:2px solid var(--i);padding:14px;margin:12px 0;background:#fffdf8}
.g{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--i);border-left:2px solid var(--i);margin-top:12px}
.k{padding:12px;border-right:2px solid var(--i);border-bottom:2px solid var(--i)}
.k b{display:block;font:700 30px/1.1 'Fraunces',serif;margin-top:4px;letter-spacing:-1px}
.k small{font-size:11px;font-weight:700}
.up{color:var(--ok)}.dn{color:var(--bad)}
button{font:700 15px 'IBM Plex Sans Arabic',sans-serif;color:var(--i);background:var(--p);border:2px solid var(--i);padding:12px 14px;cursor:pointer;box-shadow:4px 4px 0 var(--i);transition:transform .08s,box-shadow .08s,background .08s,color .08s}
@media(hover:hover){button:not(.bp):not(.bg2):hover{background:var(--i);color:var(--p)}}
button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--i);background:var(--x)!important;color:#fff!important}
.bp{background:var(--i);color:var(--p)}.bg2{background:var(--x);color:#fff}
.big{width:100%;padding:20px;font-size:19px}
input,select,textarea{font:inherit;width:100%;background:#fffdf8;border:2px solid var(--i);border-radius:0;color:var(--i);padding:11px;margin:4px 0;outline:0}
input:focus,select:focus{background:#fff;box-shadow:4px 4px 0 var(--x)}
input[type=checkbox]{width:22px!important;height:22px;accent-color:var(--x);vertical-align:middle}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;gap:10px;overflow-x:auto;margin:10px 0;padding:2px 6px 8px 2px}
.chips button{padding:6px 12px;font-size:12px;white-space:nowrap;box-shadow:3px 3px 0 var(--i)}.chips .on{background:var(--i);color:var(--p)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--p);border-top:2px solid var(--i);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;box-shadow:none;border-left:2px solid var(--i);padding:16px 2px;font-size:11px;background:var(--p)}nav button:last-child{border-left:0}
nav button.on{background:var(--i);color:var(--p)}nav button:active{transform:none}
nav i{display:none}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;border-bottom:2px solid var(--i)}.bars div{flex:1;background:var(--i);min-height:3px}.bars div:last-child{background:var(--x)}
.note{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed #11111188;font-size:13px}
.note button{box-shadow:2px 2px 0 var(--i)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--i);color:var(--p);padding:10px 18px;font-weight:700;font-size:13px;display:none;z-index:9;border:2px solid var(--x)}
.rp{background:#fffdf8;border:2px solid var(--i);padding:20px 18px}
.rp h2{margin:8px 0 0;font:700 22px 'IBM Plex Sans Arabic',sans-serif}
.wm{font:700 46px/1 'Fraunces',serif;letter-spacing:-2px;direction:ltr;text-align:right}.wm sup{font-size:12px;letter-spacing:0;vertical-align:top}
.sum{border-top:2px dashed var(--i);border-bottom:2px dashed var(--i);padding:12px 0;margin:14px 0;font-size:14px;line-height:1.9}
.ins{padding:9px 0;border-bottom:1px dashed #11111155;font-size:13px;line-height:1.7}
.gr{color:var(--x);font-weight:700}
.bar{height:18px;border:2px solid var(--i);margin:10px 0}.bar i{display:block;height:100%;background:var(--x)}
.big2{font:900 64px/1 'Fraunces',serif;letter-spacing:-3px}
.idea{border-right:8px solid var(--x)}
.u{font:700 14px 'IBM Plex Sans Arabic',sans-serif;letter-spacing:0;margin-right:6px}

.hd{display:flex;justify-content:space-between;align-items:flex-end}
.mk-w{position:relative}#mk{cursor:pointer;overflow:visible;-webkit-user-select:none;user-select:none;display:block}.mkg{transform-origin:50px 115px}
.jp .mkg{animation:jp .45s}
@keyframes jp{0%{transform:none}35%{transform:translateY(-8px)}70%{transform:translateY(0) scale(1.02,.98)}100%{transform:none}}
.bb{position:absolute;top:100%;left:0;margin-top:2px;white-space:nowrap;border:2px solid var(--i);background:#fffdf8;padding:3px 9px;font-size:12px;font-weight:700;opacity:0;transition:opacity .2s;z-index:3}.bb.on{opacity:1}
.st{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:40}
.st b{font:900 90px/1.1 'IBM Plex Sans Arabic',sans-serif;color:var(--x);border:8px double var(--x);padding:4px 36px;background:#f3efe6dd;animation:slam 1.3s forwards}
.st span{font:700 26px 'IBM Plex Sans Arabic',sans-serif;margin-top:16px;animation:rise 1.3s forwards}
@keyframes slam{0%{transform:rotate(-9deg) scale(2.6);opacity:0}18%{transform:rotate(-9deg) scale(.94);opacity:1}28%{transform:rotate(-9deg) scale(1)}80%{opacity:1}100%{transform:rotate(-9deg) scale(1);opacity:0}}
@keyframes rise{0%,18%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
.ss{position:fixed;inset:0;background:var(--p);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;padding:20px;-webkit-user-select:none;user-select:none}
.ss svg{width:min(82vw,330px);height:auto;touch-action:none}.ss .wm{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));right:20px}
.hr{stroke:#111;stroke-width:6;stroke-linecap:round;transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
.ssc{font:700 15px 'IBM Plex Sans Arabic',sans-serif;color:var(--m);margin:8px 0 18px;text-align:center}.ssc.on{font-size:36px;color:var(--x)}

#v #mk{touch-action:none}
#gm{position:fixed;inset:0;z-index:30;pointer-events:none}
.gmk{position:fixed;z-index:31;pointer-events:auto;touch-action:none;width:57px}
.mk-w{transform-origin:50% 100%}.gmk.ch .mk-w{animation:jp .35s}.mk-w.wj{animation:jp .6s}#gmk .jp .mkg{animation:none}.gmk.kis .mk-w{transform:rotate(7deg)}.fm.kis svg{transform:rotate(-7deg)}
#gm .bb{top:auto;bottom:100%;margin:0 0 2px}
.ge{position:absolute;pointer-events:auto;left:16px;top:calc(env(safe-area-inset-top,0px) + 24px);padding:10px 12px;font-size:13px}
.gc{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--i);color:var(--p);padding:5px 12px;font-weight:700;font-size:12px;white-space:nowrap}
.bn{position:absolute;left:0;top:0;will-change:transform}.bn img{height:90px;width:auto;display:block;filter:drop-shadow(0 4px 5px rgba(17,17,17,.25))}
.fm{position:fixed;z-index:32;display:none;left:-300px;width:130px;text-align:center}
.walk svg{animation:wk .28s infinite alternate}@keyframes wk{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.ht{position:absolute;animation:ht 1.1s forwards;z-index:32}@keyframes ht{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-90px) scale(1.2);opacity:0}}
.km{position:absolute;pointer-events:none;transform:rotate(-15deg)}
.dq{position:fixed;inset:0;background:#111a;z-index:45;display:flex;align-items:center;justify-content:center;padding:24px}.dq .cd{margin:0;width:100%;max-width:340px}
.mkc{width:96px;height:152px;cursor:pointer;-webkit-user-select:none;user-select:none}.mkc.cz{width:57px;height:180px}
.mkc img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}.mkc img.mkg{transform-origin:50% 100%}
.lp{position:absolute;width:52px;z-index:33;pointer-events:none;animation:lp .5s forwards}@keyframes lp{0%{transform:scale(3.2) rotate(-25deg);opacity:0}55%{transform:scale(1) rotate(-14deg);opacity:1}100%{transform:scale(1) rotate(-14deg);opacity:1}}
.gmk img,.fm img,.mkc img{filter:drop-shadow(0 8px 9px rgba(17,17,17,.26))}.gmk img{transition:transform .15s}
.gmk::after,.fm::after{content:"";position:absolute;left:-18%;bottom:-6px;width:136%;height:16px;background:radial-gradient(ellipse at center,#11111144 0%,#11111100 70%);z-index:-1}
.fm img{height:175px;width:auto;display:inline-block;transform-origin:50% 100%}.fm.walk img{animation:wk3 .5s infinite}.fm.lean img{transform:rotate(-6deg) translateX(-14px)}
@keyframes wk3{0%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}100%{transform:translateY(0) rotate(-3deg)}}
.glow{position:absolute;left:50%;width:420px;height:420px;margin-left:-210px;background:radial-gradient(circle,#ff4a1c40 0%,#ff4a1c00 68%);animation:gl .7s forwards;pointer-events:none}@keyframes gl{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.sp{position:absolute;pointer-events:none;animation:sp 1.1s forwards;z-index:34}@keyframes sp{0%{transform:scale(0) rotate(0);opacity:0}30%{opacity:1}100%{transform:translateY(-70px) scale(1.2) rotate(90deg);opacity:0}}
.bb.ang{background:var(--x);color:#fff}.mkc{position:relative}.mkc img.wide{position:absolute;left:0;bottom:0;width:auto;height:100%;max-width:none}</style></head><body>
<div id="toast"></div><div id="v"></div>
<nav id="nav"></nav>
<script>
const K='kotiva_v1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{set:{name:'',target:0},log:[],notes:[]};
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),td=()=>ds(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ds(d)};
const diff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)+1;
const f=n=>Math.round(n).toLocaleString('en-US'),f1=n=>(Math.round(n*10)/10).toLocaleString('en-US'),pc=n=>f1(n*100)+'%';
const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KN={p:'المنتج الأكثر طلبًا',o:'اعتراض من العملاء',m:'منتج مطلوب ومش متوفر',c:'منتج منافس بيكسب'};
let rg={from:addD(td(),-6),to:td()},tab='today',sale=false,rst=false;
function calc(a,b){const L=S.log.filter(x=>x.d>=a&&x.d<=b),N=S.notes.filter(x=>x.d>=a&&x.d<=b);
 const s=L.filter(x=>x.t=='s'),inv=s.length,nb=L.length-inv;
 const m={inv,cust:L.length,val:sum(s,'a'),units:sum(s,'u'),up:s.filter(x=>x.up).length,days:diff(a,b),N};
 m.conv=m.cust?inv/m.cust:0;m.abv=inv?m.val/inv:0;m.upt=inv?m.units/inv:0;m.upr=inv?m.up/inv:0;
 m.tg=(+S.set.target||0)*m.days/30;m.ach=m.tg?m.units/m.tg:null;
 m.lost=N.filter(x=>x.k=='m').reduce((t,x)=>t+(x.v||0),0);return m}
function prev(){const n=diff(rg.from,rg.to);return calc(addD(rg.from,-n),addD(rg.from,-1))}
function topN(N,k){const c={};N.filter(x=>x.k==k).forEach(x=>{const t=x.x.trim().toLowerCase();c[t]=c[t]||{n:0,t:x.x.trim()};c[t].n++});return Object.values(c).sort((a,b)=>b.n-a.n)}
function arr(c,p){if(!p)return'';const v=(c-p)/p;return`<small class="${v>=0?'up':'dn'}">${v>=0?'▲':'▼'} ${f1(Math.abs(v)*100)}%</small>`}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function go(t){tab=t;rst=false;ed=null;render()}
function setR(k){const t=td();rg=k=='d'?{from:t,to:t}:k=='w'?{from:addD(t,-6),to:t}:{from:t.slice(0,8)+'01',to:t};render()}
function chips(){const t=td(),on=(a,b)=>rg.from==a&&rg.to==b?'on':'';
 return`<div class="chips"><button class="${on(t,t)}" onclick="setR('d')">اليوم</button><button class="${on(addD(t,-6),t)}" onclick="setR('w')">آخر 7 أيام</button><button class="${on(t.slice(0,8)+'01',t)}" onclick="setR('m')">الشهر الحالي</button></div>`}
function kp(l,v,s){return`<div class="k"><span class="mu">${l}</span><b>${String(v).replace(' ريال','<span class="u">ريال</span>')}</b>${s||''}</div>`}
function render(){
 $('nav').innerHTML=[['today','','اليوم'],['dash','','الداشبورد'],['rep','','التقرير'],['log','','السجل'],['ideas','','أفكاري'],['set','','إعدادات']].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('');
 $('v').innerHTML=({today:vToday,dash:vDash,rep:vRep,log:vLog,ideas:vIdeas,set:vSet})[tab]();window.scrollTo(0,0)}
function vToday(){const t=td(),m=calc(t,t);
 return`<div class="hd"><div class="wm">kotiva<sup>™</sup></div>${G.on?'<div style="width:96px;height:152px"></div>':monkey(m)}</div><h1>${gm()}${S.set.name?' يا '+esc(S.set.name):''}</h1><div class="mu">${t}</div>
 <div class="g" style="margin-top:12px">${kp('العملاء',m.cust)}${kp('الفواتير',m.inv)}${kp('المبيعات',f(m.val)+' ريال')}${kp('Conversion',pc(m.conv))}</div>
 <div class="cd"><button class="big bg2" onclick="sale=!sale;render()"> عميل اشترى</button>
 ${sale?`<div style="margin-top:10px"><input id="am" type="number" inputmode="decimal" placeholder="قيمة الفاتورة (ريال)"><input id="un" type="number" inputmode="numeric" placeholder="عدد الوحدات"><label class="mu"><input id="up" type="checkbox" style="width:auto;margin-left:6px"> بعت منتج إضافي (Upsell)</label><button class="big bp" style="margin-top:8px" onclick="addS()">تسجيل الفاتورة</button></div>`:''}
 <button class="big" style="margin-top:10px" onclick="addN()"> عميل ما اشترش (+١ عميل)</button>
 <button style="margin-top:10px;width:100%" onclick="undo()"> تراجع عن آخر إجراء</button></div>
 <h3>ملاحظات النهاردة</h3><div class="cd"><select id="nk">${Object.entries(KN).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
 <input id="nx" placeholder="اكتب الاسم أو الاعتراض"><input id="nv" type="number" inputmode="decimal" placeholder="قيمة البيعة الضايعة التقريبية (للمنتج الغير متوفر، اختياري)">
 <button class="bp" style="width:100%" onclick="addNote()">إضافة</button>
 ${m.N.map(n=>`<div class="note"><span><b>${KN[n.k]}:</b> ${esc(n.x)}${n.v?' · '+f(n.v)+' ريال':''}</span><button style="padding:2px 9px" onclick="delNote(${n.id})">×</button></div>`).join('')}</div>`}
function addS(){const a=+$('am').value,u=+$('un').value;if(!a||!u)return toast('اكتب القيمة وعدد الوحدات');S.log.push({id:Date.now(),d:td(),t:'s',a,u,up:$('up').checked});sv();sale=false;render();stamp(a)}
function addN(){S.log.push({id:Date.now(),d:td(),t:'n'});sv();toast('عميل +١');render()}
function undo(){const i=S.log.map(x=>x.d).lastIndexOf(td());if(i<0)return toast('مفيش حاجة النهاردة');S.log.splice(i,1);sv();render()}
function addNote(){const x=$('nx').value.trim();if(!x)return toast('اكتب الملاحظة');S.notes.push({id:Date.now(),d:td(),k:$('nk').value,x,v:+$('nv').value||0});sv();render()}
function delNote(id){S.notes=S.notes.filter(n=>n.id!=id);sv();render()}
function vDash(){const m=calc(rg.from,rg.to),p=prev(),ring=m.ach==null?'—':pc(m.ach),dash=Math.min(m.ach||0,1)*264;
 const days=[];for(let d=rg.to,i=0;i<14&&d>=rg.from;i++,d=addD(d,-1))days.unshift(d);
 const vals=days.map(d=>sum(S.log.filter(x=>x.d==d&&x.t=='s'),'a')),mx=Math.max(...vals,1);
 return`<h1>الداشبورد <span></span></h1>${chips()}<div class="mu">${rg.from} ← ${rg.to}</div>
 <div class="cd"><div class="big2">${ring}</div><div class="bar"><i style="width:${Math.min(m.ach||0,1)*100}%"></i></div>
 <div><b>تحقيق التارجت</b><div class="mu">${m.tg?'المطلوب للفترة: '+f(m.tg)+' قطعة':'حدد التارجت من الإعدادات'}</div><div style="margin-top:6px">المباع ${f(m.units)} قطعة ${arr(m.units,p.units)}</div></div></div>
 <div class="g">${kp('Conversion Rate',pc(m.conv),arr(m.conv,p.conv))}${kp('متوسط الفاتورة',f(m.abv)+' ريال',arr(m.abv,p.abv))}${kp('وحدات / فاتورة',f1(m.upt),arr(m.upt,p.upt))}${kp('Upsell',pc(m.upr),arr(m.upr,p.upr))}${kp('العملاء',m.cust,arr(m.cust,p.cust))}${kp('الوحدات',m.units,arr(m.units,p.units))}</div>
 <h3>المبيعات يوم بيوم</h3><div class="cd"><div class="bars">${vals.map(v=>`<div style="height:${v/mx*100}%" title="${f(v)}"></div>`).join('')}</div></div>
 <div class="mu">الأسهم مقارنة بالفترة السابقة بنفس الطول.</div>`}
function strong(m,p){const c=[['conv','نسبة التحويل'],['abv','متوسط الفاتورة'],['upt','وحدات الفاتورة'],['upr','الـ Upsell']].filter(x=>p[x[0]]>0&&m.inv).map(x=>({n:x[1],v:(m[x[0]]-p[x[0]])/p[x[0]]}));
 c.sort((a,b)=>b.v-a.v);return c}
function vRep(){const m=calc(rg.from,rg.to),p=prev(),st=strong(m,p),B=st[0];
 const g=p.val?(m.val-p.val)/p.val:null,N=m.N,tp=topN(N,'p')[0],to=topN(N,'o')[0],tm=topN(N,'m').slice(0,3),tc=topN(N,'c')[0];
 let sm=`حققت <b>${f(m.val)} ريال</b> في ${m.days} يوم`+(m.ach!=null?`، يعني <b>${pc(m.ach)}</b> من التارجت المقابل للفترة`:'')+(g!=null?`، ${g>=0?'بنمو':'بتراجع'} <b>${f1(Math.abs(g)*100)}%</b> عن الفترة اللي قبلها`:'')+`. تعاملت مع <b>${m.cust}</b> عميل وحوّلت <b>${m.inv}</b> منهم لفاتورة (${pc(m.conv)}).`;
 if(B&&B.v>0)sm+=` أقوى نقطة: <b>${B.n}</b> (▲ ${f1(B.v*100)}%).`;
 const R=(l,v)=>`<div class="ins"><b class="gr">${l}</b><br>${v||'<span class="mu">لا توجد ملاحظات في الفترة</span>'}</div>`;
 const rep=`<div class="rp" id="rep"><div class="wm">kotiva<sup>™</sup></div><div class="mu">تقرير الأداء</div><h2>${esc(S.set.name||'مندوب Kotiva')}</h2><div class="mu">${rg.from} ← ${rg.to}</div>
 <div class="sum">${sm}</div>
 <div class="g">${kp('المبيعات',f(m.val)+' ريال',arr(m.val,p.val))}${kp('تحقيق التارجت',m.ach==null?'—':pc(m.ach))}${kp('Conversion',pc(m.conv),arr(m.conv,p.conv))}${kp('متوسط الفاتورة',f(m.abv)+' ريال',arr(m.abv,p.abv))}${kp('وحدات / فاتورة',f1(m.upt),arr(m.upt,p.upt))}${kp('Upsell',pc(m.upr),arr(m.upr,p.upr))}${kp('الفواتير',m.inv)}${kp('الوحدات',m.units)}</div>
 <h3>Weekly Insights</h3>${R('المنتج الأكثر طلبًا',tp&&`${esc(tp.t)} (${tp.n} مرة)`)}${R('أكتر اعتراض سمعته',to&&`${esc(to.t)} (${to.n} مرة)`)}${R('منتجات مطلوبة ومش متوفرة',tm.length&&tm.map(x=>`${esc(x.t)} (${x.n})`).join('، '))}${R('منتجات منافسين بتكسب',tc&&`${esc(tc.t)} (${tc.n} مرة)`)}
 ${m.lost?`<div class="sum" style="margin-top:12px"> مبيعات ضايعة بسبب عدم التوفر: تقريبًا <b>${f(m.lost)} ريال</b></div>`:''}
 <div class="mu" style="text-align:center;margin-top:12px">Kotiva Performance</div></div>`;
 return`<h1>التقرير <span></span></h1>${chips()}<div class="row"><div><span class="mu">من</span><input type="date" value="${rg.from}" onchange="rg.from=this.value||rg.from;render()"></div><div><span class="mu">إلى</span><input type="date" value="${rg.to}" onchange="rg.to=this.value||rg.to;render()"></div></div>
 ${m.cust?'':'<div class="mu">مفيش بيانات في الفترة دي لسه.</div>'}${rep}

async function exp(t){toast('بجهز الملف...');try{
 const cv=await html2canvas($('rep'),{scale:2,backgroundColor:'#f3efe6'}),nm='Kotiva-report-'+rg.from+'_'+rg.to;let blob,fn;
 if(t=='img'){blob=await new Promise(r=>cv.toBlob(r,'image/png'));fn=nm+'.png'}
 else{const w=cv.width/2,h=cv.height/2,pdf=new jspdf.jsPDF({orientation:w>h?'l':'p',unit:'px',format:[w,h]});pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,w,h);blob=pdf.output('blob');fn=nm+'.pdf'}
 await dlSave(fn,blob);$('sh').style.display='none'}catch(e){toast('حصلت مشكلة في التصدير')}}
function vIdeas(){const m=calc(rg.from,rg.to),p=prev(),r=[],t=td(),ms=t.slice(0,8)+'01',mm=calc(ms,t);
 if(m.cust>=5&&m.conv<.5)r.push(['','التحويل '+pc(m.conv),'أقل من النص. جرّب تبدأ بسؤال مفتوح عن مشكلة العميل قبل ما تعرض أي منتج.']);
 if(m.inv>=5&&m.upr<.25)r.push(['','الـ Upsell '+pc(m.upr),'اتفق مع نفسك على منتج مكمل واحد تقترحه في كل فاتورة، وراقب النسبة أسبوع.']);
 const o=topN(m.N,'o')[0];if(o)r.push(['','أكتر اعتراض: '+esc(o.t)+' ('+o.n+')','اكتب ردّ واحد قوي عليه واحفظه، وجرّبه في الأسبوع الجاي.']);
 const mi=topN(m.N,'m')[0];if(mi)r.push(['','«'+esc(mi.t)+'» مطلوب ومش موجود'+(m.lost?' · ضاع ~'+f(m.lost)+' ريال':''),'ابعت طلب توفير للإدارة بالرقم ده، ده بيوريك بتفكر إداريًا.']);
 const st=strong(m,p);if(st.length>1){const w=st[st.length-1];if(w.v<0)r.push(['','أضعف نقطة: '+w.n+' (▼ '+f1(Math.abs(w.v)*100)+'%)','ركّز عليها وحدها الأسبوع الجاي بدل ما تشتت نفسك.'])}
 if(S.set.target>0){const dm=new Date(+t.slice(0,4),+t.slice(5,7),0).getDate(),left=dm-+t.slice(8)+1,rem=S.set.target-mm.units,avg=mm.units/diff(ms,t);
  r.push(rem>0?['','باقي '+f(rem)+' قطعة على تارجت الشهر','محتاج تقريبًا '+f(rem/left)+' قطعة في اليوم، ومتوسطك دلوقتي '+f(avg)+'.']:['','عديت تارجت الشهر','ممتاز، حط تارجت شخصي أعلى وابعت للإدارة إنك سابقتهم.'])}
 return`<h1>أفكاري <span></span></h1>${chips()}<div class="mu">مبنية على تقرير الفترة المختارة. للعين دي بس، مش بتظهر في التقرير المصدّر.</div>
 ${r.length?r.map(x=>`<div class="cd idea"><b>${x[0]} ${x[1]}</b><div class="mu" style="font-size:13px;margin-top:4px">${x[2]}</div></div>`).join(''):'<div class="cd">سجّل كام يوم بيانات وأفكارك هتظهر هنا.</div>'}`}

function vLog(){const days={};S.log.forEach(x=>(days[x.d]=days[x.d]||[]).push(x));const ks=Object.keys(days).sort().reverse();
 return`<h1>السجل</h1><div class="mu">كل اللي سجلته. تقدر تعدّل أو تمسح أي حاجة.</div>
 <div class="cd"><b>إضافة ناقصة</b><input id="ld" type="date" value="${fd}"><input id="la" type="number" inputmode="decimal" placeholder="قيمة الفاتورة (فاضية = عميل ما اشترش)"><input id="lu" type="number" inputmode="numeric" placeholder="عدد الوحدات"><label class="mu"><input id="lp" type="checkbox"> Upsell</label><button class="big bp" style="margin-top:8px" onclick="addL()">إضافة</button></div>
 ${ks.length?ks.map(d=>{const m=calc(d,d);return`<h3>${d} · ${m.cust} عميل · ${f(m.val)} ريال</h3>`+days[d].slice().reverse().map(x=>x.id==ed?editRow(x):`<div class="note"><span>${x.t=='s'?'فاتورة '+f(x.a)+' ريال · '+x.u+' وحدة'+(x.up?' · Upsell':''):'عميل ما اشترش'}</span><span>${x.t=='s'?`<button onclick="ed=${x.id};render()">تعديل</button> `:''}<button onclick="delL(${x.id})">×</button></span></div>`).join('')}).join(''):'<div class="cd">لسه مفيش سجل.</div>'}`}
function editRow(x){return`<div class="cd"><input id="ea" type="number" inputmode="decimal" value="${x.a}"><input id="eu" type="number" inputmode="numeric" value="${x.u}"><label class="mu"><input id="ep" type="checkbox" ${x.up?'checked':''}> Upsell</label><div class="row" style="margin-top:8px"><button class="bp" onclick="saveE(${x.id})">حفظ</button><button onclick="ed=null;render()">إلغاء</button></div></div>`}
function saveE(id){const x=S.log.find(y=>y.id==id),a=+$('ea').value,u=+$('eu').value;if(!a||!u)return toast('اكتب القيمة والوحدات');x.a=a;x.u=u;x.up=$('ep').checked;ed=null;sv();render()}
function delL(id){S.log=S.log.filter(x=>x.id!=id);sv();render()}
function addL(){const d=$('ld').value||td(),a=+$('la').value,u=+$('lu').value;fd=d;if(a&&!u)return toast('اكتب عدد الوحدات');S.log.push(a?{id:Date.now(),d,t:'s',a,u,up:$('lp').checked}:{id:Date.now(),d,t:'n'});sv();toast('اتضافت');render()}
function vSet(){return`<h1>الإعدادات <span></span></h1><div class="cd"><span class="mu">اسمك في التقرير</span><input id="sn" value="${esc(S.set.name||'')}"><span class="mu">التارجت الشهري (عدد القطع)</span><input id="st" type="number" inputmode="decimal" value="${S.set.target||''}"><button class="big bp" style="margin-top:8px" onclick="saveSet()">حفظ</button></div>
 <div class="cd"><button style="width:100%" onclick="bk()"> نسخة احتياطية من البيانات</button><div class="mu" style="margin-top:6px">البيانات محفوظة على الموبايل ده بس، خد نسخة احتياطية من وقت للتاني.</div><span class="mu">استرجاع نسخة:</span><input type="file" accept=".json" onchange="rs(this.files[0])"></div>
 <div class="cd"><button style="width:100%;color:#d62d20" onclick="if(rst){S={set:S.set,log:[],notes:[]};sv();rst=false;toast('اتمسحت');render()}else{rst=true;this.textContent='اضغط تاني للتأكيد: مسح كل البيانات'}"> مسح كل البيانات</button></div>`}
function saveSet(){S.set.name=$('sn').value.trim();S.set.target=+$('st').value||0;sv();toast('اتحفظ ')}
async function bk(){try{await dlSave('kotiva-backup-'+td()+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}))}catch(e){toast('حصلت مشكلة')}}
async function dlSave(fn,blob){const file=new File([blob],fn,{type:blob.type});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:fn});return}catch(e){if(e&&e.name=='AbortError')return}}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function rs(fl){if(!fl)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.log)||!Array.isArray(o.notes))throw 0;S=o;sv();toast('اتسترجعت');render()}catch(e){toast('الملف مش صالح')}};r.readAsText(fl)}
